# config.yaml — e2e/yaml fixture
#
# $.scripts.init and $.scripts.run hold Lua fragments as block scalars. The
# block-scalar form keeps the fragment readable and multi-line for stepping.
version: 3
scripts:
  init: |
    local function classify(n)
        if n < 0 then
            return "negative"
        elseif n == 0 then
            return "zero"
        end
        return "positive"
    end

    local total = 0
    for i = 1, app.limits.max do
        total = total + i
    end

    host_log("init", total)
    if app.settings.verbose then
        print("init total=" .. tostring(total))
    end
    return classify(total)
  run: |
    host_log("run", fetch_count())
    return fetch_count() * 2
