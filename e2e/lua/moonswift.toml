## moonswift.toml — e2e/lua project
##
## Standalone .lua sources (no structured embedding). Exercises run, debug,
## completions, and whole-file nvim editing against plain Lua files.

lua_version = "5.4"

[[source]]
path = "main.lua"

[[source]]
path = "helper.lua"

[run]
config = "sandboxed"

[lint]
extra_modules = ["iox", "http"]

[settings]
theme = "default"

## --- Mock surface (shared across every e2e project) -----------------------

[[mock.value]]
namespace = "app"
path      = "settings.verbose"
type      = "boolean"
value     = "true"
writable  = false

[[mock.value]]
namespace = "app"
path      = "limits.max"
type      = "number"
value     = "5"
writable  = false

[[mock.function]]
name     = "host_log"
behavior = "echo-args"

[[mock.function]]
name         = "fetch_count"
behavior     = "fixed-return"
return_value = "42"
